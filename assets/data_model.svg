<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" width="100%" height="100%" style="background-color: #0f172a; font-family: Inter, sans-serif;">
  <text x="450" y="40" font-size="20" font-weight="bold" fill="#f8fafc" text-anchor="middle">Enterprise Operations Intelligence Suite — Star Schema Data Model</text>
  
  <!-- FactOrders (Central) -->
  <g transform="translate(330, 200)">
    <rect width="240" height="160" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
    <rect width="240" height="30" rx="8" fill="#38bdf8"/>
    <text x="120" y="20" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">FactOrders (Central Fact)</text>
    <text x="15" y="50" font-size="11" fill="#f8fafc">• OrderID (PK)</text>
    <text x="15" y="68" font-size="11" fill="#94a3b8">• OrderDate (FK) | CustomerID (FK)</text>
    <text x="15" y="86" font-size="11" fill="#94a3b8">• ProductID (FK) | WarehouseID (FK)</text>
    <text x="15" y="104" font-size="11" fill="#94a3b8">• CarrierID (FK)</text>
    <text x="15" y="122" font-size="11" fill="#cbd5e1">Metrics: Quantity, NetRevenue, Profit</text>
    <text x="15" y="140" font-size="10" fill="#34d399">Grain: 1 row per product line item (520k)</text>
  </g>

  <!-- DimCalendar (Top) -->
  <g transform="translate(360, 40)">
    <rect width="180" height="100" rx="8" fill="#1e293b" stroke="#818cf8" stroke-width="2"/>
    <text x="90" y="25" font-size="13" font-weight="bold" fill="#818cf8" text-anchor="middle">DimCalendar</text>
    <text x="15" y="50" font-size="11" fill="#cbd5e1">• DateKey (PK) | FullDate</text>
    <text x="15" y="68" font-size="11" fill="#cbd5e1">• Year | Quarter | Month</text>
    <text x="15" y="86" font-size="11" fill="#cbd5e1">• IsWeekend | IsHoliday</text>
  </g>

  <!-- DimCustomers (Left) -->
  <g transform="translate(40, 230)">
    <rect width="200" height="100" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
    <text x="100" y="25" font-size="13" font-weight="bold" fill="#34d399" text-anchor="middle">DimCustomers</text>
    <text x="15" y="50" font-size="11" fill="#cbd5e1">• CustomerID (PK)</text>
    <text x="15" y="68" font-size="11" fill="#cbd5e1">• Segment | Region | Country</text>
    <text x="15" y="86" font-size="11" fill="#cbd5e1">• City | LifetimeValue</text>
  </g>

  <!-- DimProducts (Right) -->
  <g transform="translate(660, 230)">
    <rect width="200" height="100" rx="8" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
    <text x="100" y="25" font-size="13" font-weight="bold" fill="#fbbf24" text-anchor="middle">DimProducts</text>
    <text x="15" y="50" font-size="11" fill="#cbd5e1">• ProductID (PK) | SKU</text>
    <text x="15" y="68" font-size="11" fill="#cbd5e1">• Category | SubCategory</text>
    <text x="15" y="86" font-size="11" fill="#cbd5e1">• Cost | SellingPrice | Margin</text>
  </g>

  <!-- DimWarehouses (Bottom Left) -->
  <g transform="translate(180, 410)">
    <rect width="220" height="100" rx="8" fill="#1e293b" stroke="#f87171" stroke-width="2"/>
    <text x="110" y="25" font-size="13" font-weight="bold" fill="#f87171" text-anchor="middle">DimWarehouses</text>
    <text x="15" y="50" font-size="11" fill="#cbd5e1">• WarehouseID (PK)</text>
    <text x="15" y="68" font-size="11" fill="#cbd5e1">• WarehouseName | Region</text>
    <text x="15" y="86" font-size="11" fill="#cbd5e1">• CapacityUnits | OperatingCost</text>
  </g>

  <!-- DimLogisticsCarriers (Bottom Right) -->
  <g transform="translate(500, 410)">
    <rect width="220" height="100" rx="8" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/>
    <text x="110" y="25" font-size="13" font-weight="bold" fill="#a78bfa" text-anchor="middle">DimLogisticsCarriers</text>
    <text x="15" y="50" font-size="11" fill="#cbd5e1">• CarrierID (PK)</text>
    <text x="15" y="68" font-size="11" fill="#cbd5e1">• CarrierName | BaseRate</text>
    <text x="15" y="86" font-size="11" fill="#cbd5e1">• ReliabilityScore (SLA %)</text>
  </g>

  <!-- Relationship Lines -->
  <line x1="450" y1="140" x2="450" y2="200" stroke="#818cf8" stroke-width="2"/>
  <line x1="240" y1="280" x2="330" y2="280" stroke="#34d399" stroke-width="2"/>
  <line x1="570" y1="280" x2="660" y2="280" stroke="#fbbf24" stroke-width="2"/>
  <line x1="390" y1="360" x2="290" y2="410" stroke="#f87171" stroke-width="2"/>
  <line x1="510" y1="360" x2="610" y2="410" stroke="#a78bfa" stroke-width="2"/>
</svg>
